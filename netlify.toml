[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Netlify sync functions cap at 10s (26s on Pro). Smaller SSR bundles + client-only
# Supabase keep cold starts under that limit.
[functions.server]
  timeout = 26
