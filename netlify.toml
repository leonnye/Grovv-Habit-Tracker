[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Netlify sync functions cap at 10s (26s on Pro). Smaller SSR bundles + client-only
# Supabase keep cold starts under that limit.
[functions.server]
  timeout = 26

# Never let browsers keep a stale HTML document after a redeploy — that's the
# main cause of "sidebar + blank page" for returning visitors.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
